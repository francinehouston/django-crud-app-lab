{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Upload Song</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/upload.css' %}">
</head>
<body>
    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'song_index' %}">Back to Songs</a>
    </div>

    <h1 class="upload-title">Upload Song</h1>
    
    <form method="POST" enctype="multipart/form-data" class="upload-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <div class="upload-message {% if message.tags %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</body>
</html>
