{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ song.title }} - Details</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/detail.css' %}">
</head>
<body>
    <div class="nav-links">
        <a href="{% url 'my_app:home' %}">Home</a>
        <a href="{% url 'my_app:song_index' %}">Back to Songs</a>
        <a href="{% url 'my_app:song_update' song.pk %}">Edit</a>
        <a href="{% url 'my_app:song_delete' song.pk %}">Delete</a>
    </div>

    <h1>{{ song.title }}</h1>
    
    <div class="song-details">
        <p><strong>Album:</strong> {{ song.album.title }}</p>
        <p><strong>Artist:</strong> {{ song.album.artist.name }}</p>
        <p><strong>Duration:</strong> {{ song.duration }}</p>
        
        {% if song.audio_file %}
        <div class="audio-player">
            <audio controls>
                <source src="{{ song.audio_file.url }}" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
        {% endif %}
    </div>
</body>
</html>
