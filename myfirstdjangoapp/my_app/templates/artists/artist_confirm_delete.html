
{% extends 'base.html'%}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Album</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<body>

    <div class="delete-confirmation">
        <h1>Delete Album</h1>
        <p>Are you sure you want to delete "{{ artist.title }}"?</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="button-group">
                <button type="submit" class="delete-button">Yes, delete</button>
                <a href="{% url 'my_app:artist_index' %}" class="cancel-button">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html> 
{% endblock%}
