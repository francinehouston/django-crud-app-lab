<!DOCTYPE html>
<html>
<head>
    <title>Update Album</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
</head>
<body>
    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'album_index' %}">Back to Albums</a>
    </div>

    <h1>Update Album</h1>
    
    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_title">Title:</label>
                {{ form.title }}
            </div>
            
            <div class="form-group">
                <label for="id_artist">Artist:</label>
                {{ form.artist }}
            </div>
            
            <div class="form-group">
                <label for="id_release_date">Release Date:</label>
                {{ form.release_date }}
            </div>
            
            <div class="form-group">
                <label for="id_cover_image">Cover Image:</label>
                {{ form.cover_image }}
                {% if album.cover_image %}
                <div class="current-image">
                    <p>Current cover:</p>
                    <img src="{{ album.cover_image.url }}" alt="Current cover">
                </div>
                {% endif %}
            </div>
            
            <button type="submit">Update</button>
        </form>
    </div>
</body>
</html>
