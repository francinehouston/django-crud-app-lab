{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Album</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<body>
    <div class="nav-links">
        <a href="{% url 'my_app:home' %}">Home</a>
        <a href="{% url 'my_app:album_index' %}">Back to Albums</a>
    </div>

    <div class="delete-confirmation">
        <h1>Delete Album</h1>
        <p>Are you sure you want to delete "{{ album.title }}"?</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="button-group">
                <button type="submit" class="delete-button">Yes, delete</button>
                <a href="{% url 'my_app:album_index' %}" class="cancel-button">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
